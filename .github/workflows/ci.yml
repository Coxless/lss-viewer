name: CI
on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - run: cargo test --release --workspace
      - run: cargo test --release -p lss-viewer-core --features parallel
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --release -p lss-viewer-wasm --target wasm32-unknown-unknown

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: cargo install --locked wasm-pack
      - run: cargo build --release -p lss-viewer-cli
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npm run build:wasm
      - working-directory: web
        run: npm run typecheck
      - working-directory: web
        run: npm test
      - working-directory: web
        run: npm run build
      - working-directory: web
        run: npx playwright install --with-deps chromium
      - working-directory: web
        run: npm run test:e2e
