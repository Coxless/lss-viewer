name: Deploy demo
# Manual on purpose: publishing needs the checks in docs/implementation-plan.md section 7.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: cargo install --locked wasm-pack
      - run: cargo build --release -p zspace-cli
      - run: scripts/fetch-data.sh
      - run: scripts/build-demo.sh web/public/dataset
      - working-directory: web
        run: npm ci && npm run build:wasm && npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
